<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="assets/options.css">
	<title>Refined Forgejo Options</title>
</head>
<body>
	<header>
		<h1>Refined Forgejo</h1>
		<p>Browser extension that simplifies the Forgejo interface</p>
	</header>

	<main>
		<section id="setup">
			<h2>Getting Started</h2>
			<ul>
				<li id="step-permissions">
					<span class="status"></span>
					<span class="text">Grant permissions to Forgejo domains</span>
				</li>
				<li id="step-token">
					<span class="status"></span>
					<span class="text">
						Generate an API token
						<a href="https://codeberg.org/user/settings/applications" target="_blank">here</a>
						with <code>repo</code> scope
					</span>
				</li>
			</ul>
		</section>

		<section>
			<h2>Documentation</h2>
			<ul>
				<li><a href="https://codeberg.org/forgejo-contrib/refine-forgejo" target="_blank">Project Page</a></li>
				<li><a href="https://codeberg.org/forgejo-contrib/refine-forgejo/issues" target="_blank">Report Issues</a></li>
			</ul>
		</section>
	</main>

	<footer>
		<p>Refined Forgejo - Making Forgejo better one feature at a time</p>
	</footer>

	<script src="assets/options.js"></script>
</body>
</html>
